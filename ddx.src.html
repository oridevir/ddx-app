<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>אבחנה מבדלת</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#0f6b5c">
<style id="app-css">
:root{
  --bg:#fff; --surface:#fff; --fg:#111; --muted:#555; --line:#e6e6e6;
  --accent:#111; --accent-soft:#f1f1f1; --warn:#e11d48; --warn-dark:#be123c; --warn-soft:#fff1f3;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",Arial,sans-serif;direction:rtl}
button{font:inherit;font-weight:600;border-radius:999px;padding:6px 14px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
button.primary{background:var(--accent);color:var(--surface)}
button:focus-visible,input:focus-visible,[role=option]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* דף ראשי */
.page{max-width:820px;margin:0 auto;padding:16px}
.page h1{margin:0 0 4px;font-size:1.4rem;color:var(--accent)}
.lead{margin:0 0 12px;color:var(--muted)}
.launch{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
.launch .msg{color:var(--muted);font-size:.9rem}
.placeholder{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* האפליקציה עצמה: עובדת גם בדף וגם בחלון הצף */
#app{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:420px}
body.floating{background:var(--surface)}
body.floating #app{height:100vh;min-height:0;border:0;border-radius:0}
.bar{position:relative;padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.bar input{flex:1;min-width:0;font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.bar .clear{padding:4px 10px;border-color:var(--line);color:var(--muted)}
.sugg{position:absolute;inset-inline:8px;top:calc(100% - 4px);z-index:3;margin:0;padding:4px 0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-height:60vh;overflow:auto}
.sugg li{padding:6px 10px;cursor:pointer}
.sugg li small{color:var(--muted);margin-inline-start:6px}
.sugg li[aria-selected=true]{background:var(--accent-soft)}
.sugg .none{color:var(--muted);cursor:default}
.body{flex:1;overflow:auto;padding:10px 12px}

/* עיון לפי מערכות כשאין חיפוש */
.sys{margin:0 0 10px}
.sys h3{margin:0 0 4px;font-size:.85rem;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{font-weight:400;font-size:.85rem;padding:2px 10px;border-color:var(--line);color:var(--fg)}
.chips button:hover{background:var(--accent-soft)}

/* כרטיס תסמין */
.card h2{margin:0 0 8px;font-size:1.15rem}
.note{margin:0 0 8px;font-size:.85rem;color:var(--muted);border-inline-start:3px solid var(--line);padding-inline-start:8px}
.subt{margin:4px 0 6px;font-size:.9rem;font-weight:700}
.cols{columns:2;column-gap:18px;margin-bottom:6px}
@media (max-width:400px){.cols{columns:1}}
.grp{break-inside:avoid;margin:0 0 10px}
.grp h4{margin:0 0 2px;padding-bottom:2px;font-size:.8rem;color:var(--accent);border-bottom:1px solid var(--line)}
.grp ul{list-style:none;margin:0;padding:0;font-size:.9rem;line-height:1.4}
.grp li{padding:1px 0}
.flags{border-top:1px solid var(--line)}
.flags button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;border-radius:0;padding:7px 12px;background:var(--warn);color:var(--surface);font-size:.9rem}
.flags .list{max-height:45vh;overflow:auto;padding:8px 12px;background:var(--warn-soft);font-size:.88rem}
.flags h5{margin:6px 0 2px;font-size:.8rem;color:var(--warn)}
.flags h5:first-child{margin-top:0}
.flags ul{margin:0;padding-inline-start:18px}

/* סגנון זברה: אייקון בכותרת, תגיות שחורות, פס אזהרה אדום */
.bar{padding-inline-start:58px;border-bottom:1px solid var(--fg)}
.bar::before{content:"";position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;
  background:linear-gradient(90deg,transparent 58%,var(--warn) 58% 70%,transparent 70%),#111 url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%278%27%20height%3D%2740%27%3E%3Cpath%20d%3D%27M0%200%20q4.8%2020%200%2040%20h4%20q4.8%20-20%200%20-40z%27%20fill%3D%27%23fff%27/%3E%3C/svg%3E");background-size:auto,8px 100%}
.bar input{border:2px solid var(--fg);border-radius:10px;background:#fff;font-weight:700}
.card h2{font-size:1.45rem;font-weight:900;letter-spacing:-.02em}
.card h2::after{content:"";display:block;width:42px;height:5px;background:var(--warn);margin-top:4px;border-radius:3px}
.grp h4{display:inline-block;background:var(--fg);color:#fff;border:0;padding:1px 9px;border-radius:999px;font-size:.72rem;margin-bottom:4px}
.flags{border:0}
.flags button{background:repeating-linear-gradient(-45deg,var(--warn) 0 12px,var(--warn-dark) 12px 24px);font-weight:800;letter-spacing:.03em}
.flags h5{color:var(--warn-dark)}

/* חלון צף מקופל: רק שורת החיפוש */
/* שורת קרדיט: הטקסט מימין, הקישור משמאל */
.credit{display:flex;justify-content:space-between;gap:8px;padding:3px 12px;font-size:.72rem;color:var(--muted);border-top:1px solid var(--line)}
.credit a{color:inherit}

body.collapsed .body,body.collapsed .flags,body.collapsed .credit{display:none}

/* מצב משגר: כשהאפליקציה נפתחת מהאייקון בשורת המשימות, כל החלון הוא כפתור אחד */
.launcher{display:none}
body.standalone .page{display:none}
body.standalone .launcher{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100vh;padding:16px;text-align:center;cursor:pointer}
.launcher img{width:72px;height:72px}
.launcher .big{font-size:1.25rem;padding:14px 28px}
.launcher p{margin:0;color:var(--muted)}
.launcher .on{display:none}
body.isfloat .launcher{cursor:default}
body.isfloat .launcher .off{display:none}
body.isfloat .launcher .on{display:block}
</style>
</head>
<body>
<div class="page" id="page">
  <h1>אבחנה מבדלת</h1>
  <p class="lead">מקלידים תסמין ומקבלים את האבחנה המבדלת. לשימוש לצד הרשומה הרפואית, בחלון צף שנשאר מעל כל החלונות.</p>
  <div class="launch">
    <button class="primary" id="float" type="button">פתח חלון צף</button>
    <span class="msg" id="msg"></span>
  </div>
  <div id="slot">
    <div id="app">
      <div class="bar">
        <input id="q" type="text" placeholder="הקלד תסמין…" aria-label="תסמין" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg">
        <button class="clear" id="clear" type="button" aria-label="ניקוי" title="ניקוי (Esc)">✕</button>
        <button class="clear" id="mini" type="button" aria-label="קיפול לשורה אחת" title="קיפול לשורה אחת" hidden>▁</button>
        <ul class="sugg" id="sugg" role="listbox" hidden></ul>
      </div>
      <div class="body" id="out"></div>
      <div class="flags" id="flags" hidden>
        <button type="button" id="flagbtn" aria-expanded="false"><span id="flagtitle"></span><span id="flagarrow">▴</span></button>
        <div class="list" id="flaglist" hidden></div>
      </div>
      <div class="credit"><span>פותח ע״י ד״ר אורי דביר</span><a href="https://drdevir.com" target="_blank" rel="noopener" dir="ltr">drdevir.com</a></div>
    </div>
  </div>
</div>

<div class="launcher" id="launcher">
  <img src="icon-192.png" alt="">
  <div class="off">
    <button class="primary big" type="button">פתח חלון צף</button>
    <p>לחיצה בכל מקום בחלון, או אנטר</p>
    <p id="msg2"></p>
  </div>
  <div class="on">
    <p><b>החלון הצף פתוח.</b></p>
    <p>אל תסגור את החלון הזה, כי זה יסגור גם את החלון הצף. אפשר למזער אותו.</p>
  </div>
</div>

<script id="ddx-data" type="application/json">/*DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById('ddx-data').textContent);

// שמות נרדפים לחיפוש, לפי שם התסמין במאגר
const SYN = {
  'חום':'fever פירקסיה',
  'ירידה לא מכוונת במשקל':'weight loss ירידה במשקל',
  'עייפות':'fatigue תשישות חולשה כללית',
  'הזעות לילה':'night sweats',
  'לימפאדנופתיה':'lymphadenopathy בלוטות לימפה מוגדלות',
  'בצקות (בצקת בגפיים התחתונות)':'edema oedema נפיחות ברגליים',
  'שיעול':'cough',
  'קוצר נשימה':'dyspnea dyspnoea SOB דיספנאה',
  'כאב בחזה':'chest pain',
  'פלפיטציות':'palpitations דפיקות לב',
  'איבוד הכרה (סינקופה)':'syncope עילפון התעלפות',
  'דופק מהיר (טכיקרדיה)':'tachycardia',
  'שיעול דם (המופטיזיס)':'hemoptysis haemoptysis',
  'כאב בטן':'abdominal pain',
  'שלשול':'diarrhea diarrhoea',
  'עצירות':'constipation',
  'בחילות והקאות':'nausea vomiting הקאה',
  'עליית אנזימי כבד':'LFT ALT AST טרנסאמינזות',
  'צהבת':'jaundice איקטרוס בילירובין',
  'צרבת':'heartburn GERD רפלוקס',
  'כאב ברום הבטן':'dyspepsia דיספפסיה epigastric',
  'דם בצואה':'rectal bleeding המטוכזיה מלנה',
  'קושי בבליעה (דיספאגיה)':'dysphagia',
  'נפיחות בטן וגזים':'bloating',
  'כאב ראש':'headache צפלגיה',
  'סחרחורת':'dizziness vertigo ורטיגו',
  'נימול וקהות':'paresthesia numbness עקצוץ',
  'פרכוסים והתקפים':'seizure אפילפסיה',
  'בלבול והפרעה בהכרה':'confusion delirium דליריום',
  'רעד':'tremor',
  'נדודי שינה':'insomnia',
  'ישנוניות יתר':'hypersomnia somnolence',
  'ירידה בזיכרון וירידה קוגניטיבית':'dementia דמנציה memory',
  'כאב גב תחתון':'low back pain LBP',
  'כאב צוואר':'neck pain',
  'כאבי שרירים (מיאלגיה)':'myalgia',
  'פריחה':'rash',
  'גרד':'pruritus itch',
  'כאב גרון':'sore throat pharyngitis',
  'כאב אוזן':'otalgia earache',
  'עין אדומה':'red eye',
  'נפיחות או גוש בצוואר':'neck mass',
  'נשירת שיער':'alopecia hair loss',
  'ירידה בשמיעה':'hearing loss',
  'טינטון (צלצולים באוזן)':'tinnitus',
  'נזלת וגודש באף':'rhinitis rhinorrhea',
  'דם בשתן (המטוריה)':'hematuria haematuria',
  'דיזוריה ותכיפות במתן שתן':'dysuria UTI צריבה במתן שתן',
  'אי-שליטה בשתן':'incontinence',
  'ירידה בזרם או קושי בהטלת שתן':'LUTS ערמונית',
  'בעיות זיקפה':'erectile dysfunction ED אימפוטנציה',
  'הפרעות בבדיקות מעבדה נפוצות':'אנמיה anemia TSH',
  'לחץ דם גבוה (ממצא)':'hypertension יתר לחץ דם',
  'לחץ דם נמוך':'hypotension',
  'גלוקוז גבוה':'hyperglycemia סוכר',
  'שומנים גבוהים':'dyslipidemia כולסטרול',
  'פרוטאינוריה':'proteinuria חלבון בשתן',
  'דימום וגינלי חריג':'AUB מטרורגיה',
  'גוש או כאב בשד':'breast mass mastalgia',
};

const norm = s => s.toLowerCase().replace(/[֑-ׇ]/g,'').replace(/["'׳״()\/,.\-–]/g,' ').replace(/\s+/g,' ').trim();
const INDEX = DATA.map((d,i) => ({i, name:norm(d.name), hay:norm(d.name+' '+(SYN[d.name]||''))}));

function search(q){
  const n = norm(q); if(!n) return [];
  const words = n.split(' ');
  const res = [];
  for(const e of INDEX){
    if(!words.every(w => e.hay.includes(w))) continue;
    let score = e.name.startsWith(n) ? 0 : (' '+e.name).includes(' '+words[0]) ? 1 : (' '+e.hay).includes(' '+words[0]) ? 2 : 3;
    res.push({i:e.i, score});
  }
  return res.sort((a,b)=>a.score-b.score || a.i-b.i).map(r=>r.i);
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// רצף לועזי עטוף ב-bdi כדי שלא ישבש את כיווניות השורה
const txt = s => esc(s).replace(/[A-Za-z][A-Za-z0-9.+\-\/ ]*[A-Za-z0-9+]|[A-Za-z]/g, m => `<bdi dir="ltr">${m}</bdi>`);

const $ = id => document.getElementById(id);
const q = $('q'), sugg = $('sugg'), out = $('out');
let items = [], sel = -1;

// פיצול רשימת אבחנות בפסיקים, בלי לפצל בתוך סוגריים
function splitDx(str){
  const out = []; let cur = '', depth = 0;
  for(const ch of str){
    if(ch==='(') depth++; else if(ch===')') depth--;
    if(ch===',' && !depth){ out.push(cur.trim()); cur=''; } else cur += ch;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
const list = items => '<ul>' + items.map(t => `<li>${txt(t)}</li>`).join('') + '</ul>';

function showCard(i){
  const d = DATA[i];
  let h = `<div class="card"><h2>${txt(d.name)}</h2>`;
  for(const b of d.b){
    if(b.t==='sub') h += `<div class="subt">${txt(b.v)}</div>`;
    else if(b.t==='note') h += `<p class="note">${txt(b.v)}</p>`;
    else if(b.t==='rows') h += '<div class="cols">' + b.v.map(([g,x]) => `<div class="grp"><h4>${txt(g)}</h4>${list(splitDx(x))}</div>`).join('') + '</div>';
  }
  out.innerHTML = h + '</div>';
  out.scrollTop = 0;
  // הדגלים האדומים בפס קבוע בתחתית החלון, נפתחים בלחיצה
  const reds = d.b.filter(b => b.t==='red');
  $('flags').hidden = !reds.length;
  $('flagtitle').textContent = '⚑ דגלים אדומים';
  $('flaglist').innerHTML = reds.map(b => (reds.length>1 ? `<h5>${txt(b.l)}</h5>` : '') + list(splitDx(b.v.replace(/\.$/,'')))).join('');
  showFlags(false);
  q.value = d.name;
  closeSugg();
}
function showFlags(on){
  $('flaglist').hidden = !on;
  $('flagbtn').setAttribute('aria-expanded', on);
  $('flagarrow').textContent = on ? '▾' : '▴';
}
$('flagbtn').addEventListener('click', () => showFlags($('flaglist').hidden));

function showBrowse(){
  const bySys = {};
  DATA.forEach((d,i) => (bySys[d.sys] ||= []).push(i));
  out.innerHTML = Object.entries(bySys).map(([s,ids]) =>
    `<div class="sys"><h3>${txt(s)}</h3><div class="chips">${ids.map(i=>`<button type="button" data-i="${i}">${txt(DATA[i].name)}</button>`).join('')}</div></div>`).join('');
}

function renderSugg(){
  items = search(q.value);
  sel = items.length ? 0 : -1;
  if(!q.value.trim()){ closeSugg(); return; }
  sugg.innerHTML = items.length
    ? items.slice(0,12).map((i,k) => `<li role="option" data-i="${i}" aria-selected="${k===sel}">${txt(DATA[i].name)}<small>${txt(DATA[i].sys)}</small></li>`).join('')
    : '<li class="none">לא נמצא תסמין כזה</li>';
  sugg.hidden = false; q.setAttribute('aria-expanded','true');
}
function closeSugg(){ sugg.hidden = true; q.setAttribute('aria-expanded','false'); }
function moveSel(dir){
  const lis = sugg.querySelectorAll('[role=option]'); if(!lis.length) return;
  sel = (sel + dir + lis.length) % lis.length;
  lis.forEach((li,k) => li.setAttribute('aria-selected', k===sel));
  lis[sel].scrollIntoView({block:'nearest'});
}
function reset(){ q.value=''; closeSugg(); showBrowse(); $('flags').hidden = true; q.focus(); }

q.addEventListener('input', renderSugg);
q.addEventListener('focus', () => q.select());
q.addEventListener('keydown', e => {
  if(e.key==='ArrowDown'){ e.preventDefault(); if(sugg.hidden) renderSugg(); else moveSel(1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); moveSel(-1); }
  else if(e.key==='Enter'){ e.preventDefault(); const li = sugg.querySelectorAll('[role=option]')[sel]; if(!sugg.hidden && li) showCard(+li.dataset.i); }
  else if(e.key==='Escape'){ e.preventDefault(); if(!sugg.hidden) closeSugg(); else reset(); }
});
sugg.addEventListener('mousedown', e => { const li = e.target.closest('[role=option]'); if(li){ e.preventDefault(); showCard(+li.dataset.i); } });
out.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(b) showCard(+b.dataset.i); });
$('clear').addEventListener('click', reset);

// ---- חלון צף ----
const app = $('app'), slot = $('slot'), msg = $('msg'), btn = $('float'), mini = $('mini');
let floatWin = null, fullSize = null;
const setMsg = t => { msg.textContent = t; $('msg2').textContent = t; };

// נפתח מהאייקון בשורת המשימות (אפליקציה מותקנת): כל החלון הוא כפתור לפתיחת החלון הצף
const standalone = matchMedia('(display-mode: standalone)').matches;
if(standalone) document.body.classList.add('standalone');

function floatSize(){
  // שמינית מסך: רבע מהרוחב, חצי מהגובה
  return { width: Math.max(380, Math.round(screen.availWidth/4)), height: Math.max(420, Math.round(screen.availHeight/2)) };
}
function moveInto(win, isPip){
  const d = win.document;
  d.documentElement.lang = 'he'; d.documentElement.dir = 'rtl';
  d.title = 'אבחנה מבדלת';
  d.head.append(document.getElementById('app-css').cloneNode(true));
  d.body.classList.add('floating');
  d.body.append(app);
  slot.innerHTML = '<div class="placeholder">החלון הצף פתוח. סגירה שלו מחזירה את הרשימה לכאן.</div>';
  btn.textContent = 'החזר לדף';
  document.body.classList.add('isfloat');
  mini.hidden = !isPip;
  floatWin = win;
  win.addEventListener('pagehide', () => {
    slot.replaceChildren(app); floatWin = null; fullSize = null; mini.hidden = true; mini.textContent = '▁';
    btn.textContent = 'פתח חלון צף'; document.body.classList.remove('isfloat');
  });
  setTimeout(() => q.focus(), 50);
}

async function openFloat(){
  if(floatWin) return;
  const {width, height} = floatSize();
  if('documentPictureInPicture' in window){
    try{ moveInto(await documentPictureInPicture.requestWindow({width, height}), true); setMsg(''); return; }
    catch(err){ setMsg('החלון הצף נכשל ('+err.name+'). נפתח חלון רגיל במקומו.'); }
  } else {
    setMsg('הדפדפן הזה לא תומך בחלון שנשאר מעל כולם. נפתח חלון רגיל בפינה השמאלית התחתונה.');
  }
  const w = window.open('', 'ddx-float', `popup,width=${width},height=${height},left=0,top=${screen.availHeight-height}`);
  if(!w){ setMsg('הדפדפן חסם את פתיחת החלון.'); return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>'); w.document.close();
  moveInto(w, false);
}

btn.addEventListener('click', () => floatWin ? floatWin.close() : openFloat());
$('launcher').addEventListener('click', openFloat);
document.addEventListener('keydown', e => { if(standalone && !floatWin && e.key==='Enter') openFloat(); });

// קיפול החלון הצף לשורת החיפוש בלבד, ופתיחה חזרה לגודל הקודם
function collapse(on){
  const w = floatWin; if(!w || on === !!fullSize) return;
  if(on){
    fullSize = {w:w.outerWidth, h:w.outerHeight};
    w.document.body.classList.add('collapsed');
    mini.textContent = '▢'; mini.title = mini.ariaLabel = 'פתיחה מלאה';
    try{ w.resizeTo(w.outerWidth, w.outerHeight - w.innerHeight + app.querySelector('.bar').offsetHeight); }catch(e){}
  } else {
    w.document.body.classList.remove('collapsed');
    mini.textContent = '▁'; mini.title = mini.ariaLabel = 'קיפול לשורה אחת';
    try{ w.resizeTo(fullSize.w, fullSize.h); }catch(e){}
    fullSize = null;
  }
}
mini.addEventListener('click', () => collapse(!fullSize));
q.addEventListener('input', () => collapse(false));

showBrowse();
q.focus();
</script>
</body>
</html>
