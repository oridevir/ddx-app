<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>אבחנה מבדלת</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f6b5c">
<style id="app-css">
:root{
  --bg:#f2f5f4; --surface:#fff; --fg:#17201d; --muted:#5b6762; --line:#dbe3e0;
  --accent:#0f6b5c; --accent-soft:#e1efeb; --warn:#a23b22; --warn-soft:#fbede7;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101715; --surface:#17201d; --fg:#e5ece9; --muted:#97a49f; --line:#2a3632;
  --accent:#5fc4ae; --accent-soft:#16302a; --warn:#f08b6d; --warn-soft:#33201a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",Arial,sans-serif;direction:rtl}
button{font:inherit;font-weight:600;border-radius:999px;padding:6px 14px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
button.primary{background:var(--accent);color:var(--surface)}
button:focus-visible,input:focus-visible,[role=option]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* דף ראשי */
.page{max-width:820px;margin:0 auto;padding:16px}
.page h1{margin:0 0 4px;font-size:1.4rem;color:var(--accent)}
.lead{margin:0 0 12px;color:var(--muted)}
.launch{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
.launch .msg{color:var(--muted);font-size:.9rem}
.placeholder{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* האפליקציה עצמה: עובדת גם בדף וגם בחלון הצף */
#app{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:420px}
body.floating{background:var(--surface)}
body.floating #app{height:100vh;min-height:0;border:0;border-radius:0}
.bar{position:relative;padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.bar input{flex:1;min-width:0;font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.bar .clear{padding:4px 10px;border-color:var(--line);color:var(--muted)}
.sugg{position:absolute;inset-inline:8px;top:calc(100% - 4px);z-index:3;margin:0;padding:4px 0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-height:60vh;overflow:auto}
.sugg li{padding:6px 10px;cursor:pointer}
.sugg li small{color:var(--muted);margin-inline-start:6px}
.sugg li[aria-selected=true]{background:var(--accent-soft)}
.sugg .none{color:var(--muted);cursor:default}
.body{flex:1;overflow:auto;padding:10px 12px}

/* עיון לפי מערכות כשאין חיפוש */
.sys{margin:0 0 10px}
.sys h3{margin:0 0 4px;font-size:.85rem;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{font-weight:400;font-size:.85rem;padding:2px 10px;border-color:var(--line);color:var(--fg)}
.chips button:hover{background:var(--accent-soft)}

/* כרטיס תסמין */
.card h2{margin:0;font-size:1.15rem}
.card .sysname{color:var(--muted);font-size:.8rem;margin-bottom:6px}
.red{background:var(--warn-soft);border-radius:6px;padding:6px 10px;margin:10px 0 0;font-size:.92rem}
.red b{color:var(--warn)}
.note{margin:6px 0;font-size:.88rem;color:var(--muted);border-inline-start:3px solid var(--line);padding-inline-start:8px}
.subt{margin:10px 0 2px;font-size:.85rem;font-weight:700;color:var(--accent)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:.92rem}
.rows li:first-child{border-top:0}
.grp{font-weight:700;color:var(--accent);font-size:.82rem;padding-top:1px}
@media (max-width:420px){.rows li{grid-template-columns:1fr;gap:0}}
.foot{padding:6px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:.75rem}
</style>
</head>
<body>
<div class="page" id="page">
  <h1>אבחנה מבדלת</h1>
  <p class="lead">מקלידים תסמין ומקבלים את האבחנה המבדלת. לשימוש לצד הרשומה הרפואית, בחלון צף שנשאר מעל כל החלונות.</p>
  <div class="launch">
    <button class="primary" id="float" type="button">פתח חלון צף</button>
    <span class="msg" id="msg"></span>
  </div>
  <div id="slot">
    <div id="app">
      <div class="bar">
        <input id="q" type="text" placeholder="הקלד תסמין…" aria-label="תסמין" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg">
        <button class="clear" id="clear" type="button" aria-label="ניקוי" title="ניקוי (Esc)">✕</button>
        <ul class="sugg" id="sugg" role="listbox" hidden></ul>
      </div>
      <div class="body" id="out"></div>
      <div class="foot">כלי עזר לחשיבה קלינית. הסדר מהשכיח לנדיר הוא הערכה כללית, ולא אומת מול הנחיות.</div>
    </div>
  </div>
</div>

<script id="ddx-data" type="application/json">/*DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById('ddx-data').textContent);

// שמות נרדפים לחיפוש, לפי שם התסמין במאגר
const SYN = {
  'חום':'fever פירקסיה',
  'ירידה לא מכוונת במשקל':'weight loss ירידה במשקל',
  'עייפות':'fatigue תשישות חולשה כללית',
  'הזעות לילה':'night sweats',
  'לימפאדנופתיה':'lymphadenopathy בלוטות לימפה מוגדלות',
  'בצקות (בצקת בגפיים התחתונות)':'edema oedema נפיחות ברגליים',
  'שיעול':'cough',
  'קוצר נשימה':'dyspnea dyspnoea SOB דיספנאה',
  'כאב בחזה':'chest pain',
  'פלפיטציות':'palpitations דפיקות לב',
  'איבוד הכרה (סינקופה)':'syncope עילפון התעלפות',
  'דופק מהיר (טכיקרדיה)':'tachycardia',
  'שיעול דם (המופטיזיס)':'hemoptysis haemoptysis',
  'כאב בטן':'abdominal pain',
  'שלשול':'diarrhea diarrhoea',
  'עצירות':'constipation',
  'בחילות והקאות':'nausea vomiting הקאה',
  'עליית אנזימי כבד':'LFT ALT AST טרנסאמינזות',
  'צהבת':'jaundice איקטרוס בילירובין',
  'צרבת':'heartburn GERD רפלוקס',
  'כאב ברום הבטן':'dyspepsia דיספפסיה epigastric',
  'דם בצואה':'rectal bleeding המטוכזיה מלנה',
  'קושי בבליעה (דיספאגיה)':'dysphagia',
  'נפיחות בטן וגזים':'bloating',
  'כאב ראש':'headache צפלגיה',
  'סחרחורת':'dizziness vertigo ורטיגו',
  'נימול וקהות':'paresthesia numbness עקצוץ',
  'פרכוסים והתקפים':'seizure אפילפסיה',
  'בלבול והפרעה בהכרה':'confusion delirium דליריום',
  'רעד':'tremor',
  'נדודי שינה':'insomnia',
  'ישנוניות יתר':'hypersomnia somnolence',
  'ירידה בזיכרון וירידה קוגניטיבית':'dementia דמנציה memory',
  'כאב גב תחתון':'low back pain LBP',
  'כאב צוואר':'neck pain',
  'כאבי שרירים (מיאלגיה)':'myalgia',
  'פריחה':'rash',
  'גרד':'pruritus itch',
  'כאב גרון':'sore throat pharyngitis',
  'כאב אוזן':'otalgia earache',
  'עין אדומה':'red eye',
  'נפיחות או גוש בצוואר':'neck mass',
  'נשירת שיער':'alopecia hair loss',
  'ירידה בשמיעה':'hearing loss',
  'טינטון (צלצולים באוזן)':'tinnitus',
  'נזלת וגודש באף':'rhinitis rhinorrhea',
  'דם בשתן (המטוריה)':'hematuria haematuria',
  'דיזוריה ותכיפות במתן שתן':'dysuria UTI צריבה במתן שתן',
  'אי-שליטה בשתן':'incontinence',
  'ירידה בזרם או קושי בהטלת שתן':'LUTS ערמונית',
  'בעיות זיקפה':'erectile dysfunction ED אימפוטנציה',
  'הפרעות בבדיקות מעבדה נפוצות':'אנמיה anemia TSH',
  'לחץ דם גבוה (ממצא)':'hypertension יתר לחץ דם',
  'לחץ דם נמוך':'hypotension',
  'גלוקוז גבוה':'hyperglycemia סוכר',
  'שומנים גבוהים':'dyslipidemia כולסטרול',
  'פרוטאינוריה':'proteinuria חלבון בשתן',
  'דימום וגינלי חריג':'AUB מטרורגיה',
  'גוש או כאב בשד':'breast mass mastalgia',
};

const norm = s => s.toLowerCase().replace(/[֑-ׇ]/g,'').replace(/["'׳״()\/,.\-–]/g,' ').replace(/\s+/g,' ').trim();
const INDEX = DATA.map((d,i) => ({i, name:norm(d.name), hay:norm(d.name+' '+(SYN[d.name]||''))}));

function search(q){
  const n = norm(q); if(!n) return [];
  const words = n.split(' ');
  const res = [];
  for(const e of INDEX){
    if(!words.every(w => e.hay.includes(w))) continue;
    let score = e.name.startsWith(n) ? 0 : (' '+e.name).includes(' '+words[0]) ? 1 : (' '+e.hay).includes(' '+words[0]) ? 2 : 3;
    res.push({i:e.i, score});
  }
  return res.sort((a,b)=>a.score-b.score || a.i-b.i).map(r=>r.i);
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// רצף לועזי עטוף ב-bdi כדי שלא ישבש את כיווניות השורה
const txt = s => esc(s).replace(/[A-Za-z][A-Za-z0-9.+\-\/ ]*[A-Za-z0-9+]|[A-Za-z]/g, m => `<bdi dir="ltr">${m}</bdi>`);

const $ = id => document.getElementById(id);
const q = $('q'), sugg = $('sugg'), out = $('out');
let items = [], sel = -1;

function showCard(i){
  const d = DATA[i];
  let h = `<div class="card"><h2>${txt(d.name)}</h2><div class="sysname">${txt(d.sys)}</div>`;
  for(const b of d.b){
    if(b.t==='red') continue;
    if(b.t==='sub') h += `<div class="subt">${txt(b.v)}</div>`;
    else if(b.t==='note') h += `<p class="note">${txt(b.v)}</p>`;
    else if(b.t==='rows') h += '<ul class="rows">' + b.v.map(([g,x]) => `<li><span class="grp">${txt(g)}</span><span>${txt(x)}</span></li>`).join('') + '</ul>';
  }
  // הדגלים האדומים תמיד בתחתית הכרטיס
  for(const b of d.b) if(b.t==='red') h += `<p class="red"><b>${txt(b.l)}:</b> ${txt(b.v)}</p>`;
  out.innerHTML = h + '</div>';
  out.scrollTop = 0;
  q.value = d.name;
  closeSugg();
}

function showBrowse(){
  const bySys = {};
  DATA.forEach((d,i) => (bySys[d.sys] ||= []).push(i));
  out.innerHTML = Object.entries(bySys).map(([s,ids]) =>
    `<div class="sys"><h3>${txt(s)}</h3><div class="chips">${ids.map(i=>`<button type="button" data-i="${i}">${txt(DATA[i].name)}</button>`).join('')}</div></div>`).join('');
}

function renderSugg(){
  items = search(q.value);
  sel = items.length ? 0 : -1;
  if(!q.value.trim()){ closeSugg(); return; }
  sugg.innerHTML = items.length
    ? items.slice(0,12).map((i,k) => `<li role="option" data-i="${i}" aria-selected="${k===sel}">${txt(DATA[i].name)}<small>${txt(DATA[i].sys)}</small></li>`).join('')
    : '<li class="none">לא נמצא תסמין כזה</li>';
  sugg.hidden = false; q.setAttribute('aria-expanded','true');
}
function closeSugg(){ sugg.hidden = true; q.setAttribute('aria-expanded','false'); }
function moveSel(dir){
  const lis = sugg.querySelectorAll('[role=option]'); if(!lis.length) return;
  sel = (sel + dir + lis.length) % lis.length;
  lis.forEach((li,k) => li.setAttribute('aria-selected', k===sel));
  lis[sel].scrollIntoView({block:'nearest'});
}
function reset(){ q.value=''; closeSugg(); showBrowse(); q.focus(); }

q.addEventListener('input', renderSugg);
q.addEventListener('focus', () => q.select());
q.addEventListener('keydown', e => {
  if(e.key==='ArrowDown'){ e.preventDefault(); if(sugg.hidden) renderSugg(); else moveSel(1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); moveSel(-1); }
  else if(e.key==='Enter'){ e.preventDefault(); const li = sugg.querySelectorAll('[role=option]')[sel]; if(!sugg.hidden && li) showCard(+li.dataset.i); }
  else if(e.key==='Escape'){ e.preventDefault(); if(!sugg.hidden) closeSugg(); else reset(); }
});
sugg.addEventListener('mousedown', e => { const li = e.target.closest('[role=option]'); if(li){ e.preventDefault(); showCard(+li.dataset.i); } });
out.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(b) showCard(+b.dataset.i); });
$('clear').addEventListener('click', reset);

// ---- חלון צף ----
const app = $('app'), slot = $('slot'), msg = $('msg'), btn = $('float');
let floatWin = null;

function floatSize(){
  // שמינית מסך: רבע מהרוחב, חצי מהגובה
  return { width: Math.max(380, Math.round(screen.availWidth/4)), height: Math.max(420, Math.round(screen.availHeight/2)) };
}
function moveInto(win){
  const d = win.document;
  d.documentElement.lang = 'he'; d.documentElement.dir = 'rtl';
  d.title = 'אבחנה מבדלת';
  d.head.append(document.getElementById('app-css').cloneNode(true));
  d.body.classList.add('floating');
  d.body.append(app);
  slot.innerHTML = '<div class="placeholder">החלון הצף פתוח. סגירה שלו מחזירה את הרשימה לכאן.</div>';
  btn.textContent = 'החזר לדף';
  floatWin = win;
  win.addEventListener('pagehide', () => {
    slot.replaceChildren(app); floatWin = null; btn.textContent = 'פתח חלון צף';
  });
  setTimeout(() => q.focus(), 50);
}

btn.addEventListener('click', async () => {
  if(floatWin){ floatWin.close(); return; }
  const {width, height} = floatSize();
  if('documentPictureInPicture' in window){
    try{ moveInto(await documentPictureInPicture.requestWindow({width, height})); msg.textContent = ''; return; }
    catch(err){ msg.textContent = 'החלון הצף נכשל ('+err.name+'). נפתח חלון רגיל במקומו.'; }
  } else {
    msg.textContent = 'הדפדפן הזה לא תומך בחלון שנשאר מעל כולם. נפתח חלון רגיל בפינה השמאלית התחתונה.';
  }
  const w = window.open('', 'ddx-float', `popup,width=${width},height=${height},left=0,top=${screen.availHeight-height}`);
  if(!w){ msg.textContent = 'הדפדפן חסם את פתיחת החלון.'; return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>'); w.document.close();
  moveInto(w);
});

showBrowse();
q.focus();
</script>
</body>
</html>
